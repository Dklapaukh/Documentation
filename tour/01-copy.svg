<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title"><title id="title">Prepare and copy text into the matching ePRF fields</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#b28325" stroke-width="1.5"/></marker></defs><rect width="900" height="660" fill="#e8e9e3"/><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="900" height="58" fill="#202327" stroke="#202327"/><text x="22" y="37" font-size="24" fill="#fff" font-weight="600">Paramedic Notes</text><text x="250" y="35" font-size="19" fill="#a1a7ab" font-weight="500">History</text><text x="374" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Assessment</text><text x="498" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Impression</text><text x="622" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Disposition</text><text x="746" y="35" font-size="19" fill="#fff" font-weight="500">Output</text><path d="M746 56h100" stroke="#c9b16d" stroke-width="3"/><text x="30" y="105" font-size="22" fill="#697077" font-weight="700">YOUR ENTRIES</text><text x="500" y="105" font-size="22" fill="#697077" font-weight="700">FORMATTED OUTPUT</text><text x="30" y="150" font-size="22" fill="#697077" font-weight="600">History</text><rect x="30" y="164" width="325" height="94" fill="#fafaf7" stroke="#c9cec2"/><text x="44" y="199" font-size="22" fill="#22262a" font-weight="400">History entered here…</text><text x="30" y="302" font-size="22" fill="#697077" font-weight="600">Assessment</text><rect x="30" y="316" width="325" height="94" fill="#fafaf7" stroke="#c9cec2"/><text x="44" y="351" font-size="22" fill="#22262a" font-weight="400">Reported symptoms…</text><text x="44" y="382" font-size="22" fill="#22262a" font-weight="400">Observed findings…</text><rect x="490" y="135" width="380" height="336" fill="#fafaf7" stroke="#c9cec2"/><text x="510" y="17