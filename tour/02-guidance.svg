<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title"><title id="title">Keep writing while reading assessment guidance in its own sidebar</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#b28325" stroke-width="1.5"/></marker></defs><rect width="900" height="660" fill="#e8e9e3"/><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="900" height="58" fill="#202327" stroke="#202327"/><text x="22" y="37" font-size="24" fill="#fff" font-weight="600">Paramedic Notes</text><text x="250" y="35" font-size="19" fill="#a1a7ab" font-weight="500">History</text><text x="374" y="35" font-size="19" fill="#fff" font-weight="500">Assessment</text><path d="M374 56h100" stroke="#c9b16d" stroke-width="3"/><text x="498" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Impression</text><text x="622" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Disposition</text><text x="746" y="35" font-size="19" fill="#a1a7ab" font-weight="500">Output</text><rect x="18" y="80" width="535" height="550" fill="#fafaf7" stroke="#c9cec2"/><rect x="574" y="80" width="308" height="550" fill="#e4e7dd" stroke="#c9cec2"/><text x="38" y="120" font-size="28" fill="#22262a" font-weight="700">Subjective</text><rect x="366" y="93" width="165" height="46" fill="#fafaf7" stroke="#c9cec2"/><text x="380" y="123" font-size="22" fill="#22262a" font-weight="600">Guidance…</text><rect x="36" y="150" width="500" height="210" fill="#fafaf7" stroke="#c9cec2"/><text x="54" y="189" font-size="25" fill="#22262a" font-weight="400">Your reported symptoms</text><text x="54" y="224" font-size="25" fill="#22262a" font-weight="400">remain editable here.</text><path d="M55 245v30" stroke="#22262a" stroke-width="3"/><text x="38" y="410" font-size="28" fill="#22262a" font-weight="700">Objective</text><rect x="36" y="432" width="500" height="164" fill="#fafaf7" stroke="#c9cec2"/><text x="54" y="470" font-size="24" fill="#697077" font-weight="400">Observed findings…</text><text x="592" y="120" font-size="22" fill="#697077" font-weight="700">GUIDANCE</text><path d="M592 143H862" stroke="#c9cec2"/><text x="592" y="180" font-size="26" fill="#22262a" font-weight="700">Respiratory</text><text x="592" y="230" font-size="23" fill="#22262a" font-weight="400">Onset / progression</text><text x="592" y="291" font-size="23" fill="#22262a" font-weight="400">Cough / sputum</text><text x="592" y="352" font-size="23" fill="#22262a" font-weight="400">Chest symptoms</text><text x="592" y="413" font-size="23" fill="#22262a" font-weight="400">Relevant history</text><path d="M480 135L580 162" stroke="#b28325" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="592" y="510" width="267" height="74" fill="#f4ecd5" stroke="#b28325"/><text x="606" y="540" font-size="23" fill="#22262a" font-weight="600">Read and write</text><text x="606" y="570" font-size="23" fill="#22262a" font-weight="400">at the same time.</text></g></svg>